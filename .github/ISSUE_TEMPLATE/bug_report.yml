name: 不具合の報告
description: 再現手順・期待した動作・実際の動作
labels: ["bug"]
body:
  - type: textarea
    id: details
    attributes:
      label: 再現手順・期待した動作・実際の動作
      description: 実教材・個人情報・秘密情報を含めないでください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 確認環境
      placeholder: ブラウザー・OS・画面幅
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開前の確認
      options:
        - label: 教材・個人情報・秘密情報を含めていません
          required: true
